<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Дача отца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{
  --acc:#c2412d; --ink:#17212b; --ink2:#55606d; --glass:rgba(255,255,255,.55); --glass-b:rgba(255,255,255,.8);
  --chip:rgba(23,33,43,.06); --chip-h:rgba(23,33,43,.11); --shadow:0 10px 30px rgba(30,50,80,.18); --bg:#bcd6ea;
}
body.night{ --ink:#eef3fa; --ink2:#a6b4c6; --glass:rgba(14,22,36,.58); --glass-b:rgba(255,255,255,.12); --chip:rgba(255,255,255,.07); --chip-h:rgba(255,255,255,.14); --shadow:0 10px 30px rgba(0,0,0,.45); --bg:#0d1524; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#bcd6ea; } }
:root[data-theme="dark"]{ --bg:#0d1524; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--glass-b);box-shadow:var(--shadow);border-radius:1.1rem}
.bar{position:fixed;top:14px;left:16px;right:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.title{padding:.55rem .95rem;line-height:1.15}
.title b{display:block;font-size:1rem;font-weight:800;letter-spacing:-.01em}
.title small{font-size:.74rem;color:var(--ink2);font-weight:600}
.sp{flex:1}
.seg{display:flex;gap:3px;padding:4px}
.seg button{height:2.15rem;padding:0 .8rem;border-radius:.75rem;font-weight:700;font-size:.84rem;color:var(--ink2);display:flex;align-items:center;gap:.35rem;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{background:var(--chip-h);color:var(--ink)}
.seg button.on{background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(194,65,45,.35)}
.seg svg{width:1rem;height:1rem}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:.5rem .9rem;font-size:.78rem;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:5}
#tag{position:fixed;left:0;top:0;display:none;padding:.45rem .8rem;border-radius:.8rem;font-weight:800;font-size:.92rem;pointer-events:none;z-index:6;white-space:nowrap;text-align:center}
#tag small{display:block;font-weight:600;font-size:.72rem;color:var(--ink2)}
#tag:after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:inherit;border-right:1px solid var(--glass-b);border-bottom:1px solid var(--glass-b)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-weight:700;color:#3d5266;transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
body.shot .bar,body.shot .hint,body.shot #tag{display:none!important}
@media (max-width:700px){ .title small{display:none} .seg button{padding:0 .55rem;font-size:.78rem} .seg button .lbl{display:none} .hint{font-size:.7rem;bottom:10px;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <div class="title glass"><b>Дача отца</b><small>Ленинградская область · макет по фото</small></div>
  <div class="sp"></div>
  <div class="seg glass"><button id="bFly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span class="lbl">Облёт</span></button></div>
  <div class="seg glass" id="sDN"><button data-v="day" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lbl">День</span></button><button data-v="night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="lbl">Ночь</span></button></div>
  <div class="seg glass" id="sRain"><button id="bRain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15a4 4 0 1 1 1-7.9A5 5 0 0 1 18 9a3.5 3.5 0 0 1 0 7H7z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg><span class="lbl">Дождь</span></button></div>
  <div class="seg glass" id="sSeason"><button data-v="spring" class="on">Весна</button><button data-v="summer">Лето</button><button data-v="autumn">Осень</button><button data-v="winter">Зима</button></div>
</div>
<div class="hint glass">Тяни — вращать · правой кнопкой — двигать · колесо — масштаб · клик по постройке</div>
<div id="tag" class="glass"></div>
<div id="loading">Строим участок…</div>

/* ================= процедурные текстуры ================= */

/* бревно: волокна вдоль длины (v), кольца по окружности (u) */

{
  const c = cvs(256, 256), g = c.getContext('2d');

  const c3 = cvs(128, 128), g3 = c3.getContext('2d'); g3.fillStyle = '#f4f2ee'; g3.fillRect(0, 0, 128, 128);

/* металлочерепица: 6 волн × 3 ступени на 1.11 × 1.05 м */
TX.tileN = normalTex(256, (u, v) => { const w = Math.cos(u * Math.PI * 12) * 0.35; const f = (v * 3) % 1; const st = f < 0.12 ? f / 0.12 : 1 - (f - 0.12) / 0.88 * 0.55; return w + st * 1.4; }, 3.2);
{ const c = cvs(256, 256), g = c.getContext('2d');

{ const c = cvs(256, 16), g = c.getContext('2d'); for (let x = 0; x < 256; x++) { const t = trap(x / 256); const k = .8 + t * .25; g.fillStyle = rgb(200 * k, 204 * k, 208 * k); g.fillRect(x, 0, 1, 16); } TX.corrGrey = ctex(c); }

/* тротуарная плитка «кирпичик», корзинка 0.2 м, текстура на 1.6 м */
{
  const N = 1024, cell = N / 8, c = cvs(N, N), g = c.getContext('2d');

    const hor = (cx + cy) % 2 === 0;

    }

  const deck = (x0, x1, z0, z1) => { box(g, x1 - x0, .12, z1 - z0, (x0 + x1) / 2, py, (z0 + z1) / 2, MAT.wood); box(g, x1 - x0 - .2, py - .06, z1 - z0 - .2, (x0 + x1) / 2, (py - .06) / 2, (z0 + z1) / 2, MAT.plinth); };
  deck(wx0, px1, pz0, pz1); deck(wx0, wx1, pz1, wz1);
  const PH = 2.45, postAt = (x, z) => { cyl(g, .11, PH, x, py + PH / 2, z, MAT.log, 12); for (let y = py + .12; y < py + PH - .05; y += .22) addWEnd('banya', x - .2, x + .2, y, z, 'x', .1); };
  const posts = [[wx0 + .12, pz0 + .12], [cx - 1.2, pz0 + .12], [cx + 1.2, pz0 + .12], [px1 - .12, pz0 + .12], [wx0 + .12, pz1 + .8], [wx0 + .12, wz1 - .12]];

  const wA = V3(wx0 - ovr, loY, wz1 + .3), wB = V3(wx1, hiY, wz1 + .3);

  /* доски, сложенные на навесе (видны с дрона) */
  for (let i = 0; i < 6; i++) { const z = pz0 + .1 + i * .32; const y = lerp(py + 2.7, wallTop + .05, (z - pz0 + .45) / (pz1 - pz0 + .45)); beam(g, V3(px0 + rr(-.2, .6), y + .05, z), V3(px1 + rr(-.3, .9), y + .05, z + rr(-.05, .05)), .14, .04, MAT.woodRaw); }

  { const m = cyl(g, .22, .04, cx - 1.0, base + 1.7, pz1 - .07, new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: .7 })); m.rotation.x = Math.PI / 2; }

/* --- Избушка (фото 3): повал — брёвна расходятся кверху, крутая крыша, серая дощатая дверь, фонарь, труба на коньке --- */
{

  const cx = -15.9, cz = -16.5, w = 1.9, d = 2.8, base = .3, wallH = 1.7, r = .11, flareMax = .6;

  for (const wall of ['s', 'n']) logGable({ b: 'hut', cx, cz, w, d, wall, span: spanE - .3, y0: eave + .02, rise: rise - .1, r, tint: .9, gaps: y => wall === 's' && y < base + 2.05 ? [[cx - .44, cx + .44]] : [] });

/* --- Беседка (фото 5): сруб с арочным проёмом во фронтоне на юг, крутая крыша, фонарь, лавка и стол --- */
{

/* --- Сарай (фото 6): газобетон, двустворчатая красная дверь, длинная крыша-металлочерепица, глубокий свес с видимыми стропилами на востоке --- */
{
  const g = bld('shed', 'Сарай', 'газобетон, у въезда', -24.55, 12.7, 5.5, 4.5);
  const x0 = -28.4, x1 = -21.2, z0 = 10.3, z1 = 15.1, h = 2.3, gap = .26, rise = 1.95;
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, w = x1 - x0, d = z1 - z0;
  FOOT.push([x0 - .4, z0 - .6, x1 + 1, z1 + .5]);
  const blk = (W_, H_, D_, x, y, z) => { const geo = new THREE.BoxGeometry(W_, H_, D_); const uv = geo.attributes.uv; const pos = geo.attributes.position, nor = geo.attributes.normal; for (let i = 0; i < uv.count; i++) { const px = pos.getX(i) + x, py = pos.getY(i) + y, pz = pos.getZ(i) + z, nx = Math.abs(nor.getX(i)); uv.setXY(i, (nx > .5 ? pz : px), py); } const m = new THREE.Mesh(geo, MAT.block); m.position.set(x, y, z); geo.translate(0, 0, 0); m.castShadow = m.receiveShadow = true; g.add(m); return m; };
  blk(w, h, .3, cx, h / 2, z0 + .15); blk(w, h, .3, cx, h / 2, z1 - .15); blk(.3, h, d - .6, x0 + .15, h / 2, cz); blk(.3, h, d - .6, x1 - .15, h / 2, cz);
  /* щель из досок между стеной и крышей */

  /* фронтоны из блоков (ступенчато) */
  for (const xw of [x0 + .15, x1 - .15]) { for (let i = 0; i < 6; i++) { const y = h + .12 + i * .25, hw = (d / 2) * (1 - (i * .25 + .125) / rise); if (hw < .15) break; blk(.3, .25, hw * 2, xw, y + .125, cz); } }
  const eave = h + gap + .02;
  const R = gableRoof(g, { cx: cx + .3, cz, span: d, len: w + .6, eaveY: eave, rise, axis: 'x', ovS: .45, ovE: .3, matA: MAT.corr, matB: MAT.tile });

  for (const [x, a] of [[-28.2, .15], [-28.0, -.1]]) { const m = cyl(g, .02, 1.5, x, .75, z0 - .25, MAT.iron, 6); m.rotation.z = a; }

/* --- Сарай и навес (верх по центру): одна двускатная крыша; северная треть — сарай из бревна, южные две трети — открытый навес на столбах --- */
{

  for (const wall of ['n', 's']) logGable({ b: 'long', cx, cz: scz, w, d: sd, wall, span: w, y0: wallTop - .08, rise, r: .12, tint: .92 });

  const yAt = x => wallTop + rise - Math.abs(x - cx) * rise / (w / 2);

  /* под навесом: верстак, инструмент, бочка */
  box(g, .7, .06, 1.8, cx + w / 2 - .6, .9, zSplit + 1.6, MAT.woodRaw); for (const [dx, dz] of [[-.3, -.8], [.3, -.8], [-.3, .8], [.3, .8]]) box(g, .06, .88, .06, cx + w / 2 - .6 + dx, .44, zSplit + 1.6 + dz, MAT.woodRaw);
  box(g, .25, .2, .4, cx + w / 2 - .6, 1.03, zSplit + 1.3, MAT.darkSteel);
  for (let i = 0; i < 4; i++) { const m = cyl(g, .018, 1.5, cx + w / 2 - .25, .75, zSplit + 3.2 + i * .22, MAT.woodRaw, 6); m.rotation.x = .12; }
  box(g, .22, .28, .02, cx + w / 2 - .25, .12, zSplit + 3.2, MAT.steel);

}
